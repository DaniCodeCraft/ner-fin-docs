seed: 42

model:
  name: 'cointegrated/rubert-tiny2'
  max_length: 256
  num_labels: 21

labels:
  - O
  - B-ORG
  - I-ORG
  - B-PERSON
  - I-PERSON
  - B-MONEY
  - I-MONEY
  - B-DATE
  - I-DATE
  - B-INN
  - I-INN
  - B-OGRN
  - I-OGRN
  - B-KPP
  - I-KPP
  - B-BIK
  - I-BIK
  - B-ACCOUNT
  - I-ACCOUNT
  - B-CONTRACT
  - I-CONTRACT

training:
  batch_size: 8
  epochs: 5
  lr: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  eval_split: 0.15
  test_split: 0.15

data:
  n_documents: 1500
  output_dir: 'data/processed'
  raw_dir: 'data/raw'
