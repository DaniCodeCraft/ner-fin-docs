version: '3.9'

services:
  api:
    build: .
    container_name: ner-fin-api
    ports:
      - '8000:8000'
    volumes:
      - ./models:/app/models:ro
      - hf-cache:/app/.cache/huggingface
    environment:
      - HF_HOME=/app/.cache/huggingface
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

volumes:
  hf-cache:
